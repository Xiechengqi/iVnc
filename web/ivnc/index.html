<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <title>iVnc Remote Desktop</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div id="app"></div>
  <script>
    (function() {
      window.__IVNC_APP_VIEW__ = window.location.pathname.startsWith('/app-view/');
      // Embedded app views are stream tabs of the main desktop page (app-streams.js).
      window.__IVNC_EMBED__ = window.__IVNC_APP_VIEW__ && window.parent !== window
        && new URLSearchParams(window.location.search).get('embed') === '1';
      window.__ivncViewActive = !window.__IVNC_EMBED__;
      const configBase = window.__IVNC_APP_VIEW__ ? window.location.pathname : '/';
      window.__IVNC_WS_HOST__ = window.location.hostname;
      // Server replaces __IVNC_INJECTED_PORT__ with actual port (e.g., "8007")
      // The variable name __IVNC_WS_PORT__ is preserved
      const injectedPort = "__IVNC_INJECTED_PORT__";
      if (injectedPort !== "__IVNC_INJECTED_PORT__") {
        window.__IVNC_WS_PORT__ = injectedPort;
      } else {
        window.__IVNC_WS_PORT__ = "8007";
      }
      window.__IVNC_TCP_ONLY__ = false;
      Promise.all([
        fetch(`${configBase}ws-config?ts=${Date.now()}`, { cache: 'no-store' })
          .then((resp) => resp.ok ? resp.json() : null),
        fetch(`${configBase}ui-config?ts=${Date.now()}`, { cache: 'no-store' })
          .then((resp) => resp.ok ? resp.json() : null)
      ])
        .then(([wsConfig, uiConfig]) => {
          if (wsConfig && wsConfig.ws_port) {
            window.__IVNC_WS_PORT__ = String(wsConfig.ws_port);
            console.log('iVnc WS port set from ws-config', window.__IVNC_WS_PORT__);
          }
          if (wsConfig && typeof wsConfig.tcp_only === 'boolean') {
            window.__IVNC_TCP_ONLY__ = wsConfig.tcp_only;
          }
          if (uiConfig) {
            window.__IVNC_UI_CONFIG__ = uiConfig;
          }
        })
        .catch((err) => {
          console.warn('iVnc startup config fetch failed', err);
        })
        .finally(() => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = 'ivnc-core.js?v=61';
          document.head.appendChild(script);
        });
    })();
    if (!window.__IVNC_APP_VIEW__ && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.warn('Service worker unavailable', err));
    }
  </script>
</body>
</html>
