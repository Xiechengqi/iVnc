<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a1a2e">
    <title>登录 · iVnc</title>
    <link rel="icon" href="/icons/icon.svg">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f4f7f9; color: #253244; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 360px; padding: 28px; background: #fff; border: 1px solid #dfe6e9; border-radius: 12px; box-shadow: 0 8px 28px #2532440c; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        h1 { font-size: 24px; margin: 0; letter-spacing: -.6px; }
        h2 { font-size: 17px; margin: 0 0 22px; font-weight: 500; }
        label { display: block; font-size: 14px; margin-bottom: 6px; }
        input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cbd5df; border-radius: 6px; margin-bottom: 18px; font: inherit; }
        input:focus-visible { outline: 2px solid #0984e3; outline-offset: 2px; }
        [hidden] { display: none !important; }
        .password-field { position: relative; margin-bottom: 18px; }
        .password-field input { margin-bottom: 0; padding-right: 48px; }
        #password-toggle { position: absolute; right: 1px; top: 1px; width: 44px; height: calc(100% - 2px); min-height: 42px; border: 0; border-radius: 0 5px 5px 0; background: transparent; color: #52657b; display: grid; place-items: center; }
        #password-toggle:hover { background: #eef6ff; color: #075fa8; }
        #password-toggle:focus-visible { outline: 2px solid #0984e3; outline-offset: -3px; }
        #password-toggle svg { width: 20px; height: 20px; pointer-events: none; }
        #ip-login { width: 100%; min-height: 44px; border: 1px solid #8fc2ee; border-radius: 6px; background: #eef6ff; color: #075fa8; margin-bottom: 18px; }
        #login-check { color: #52657b; font-size: 14px; }
        button { cursor: pointer; font: inherit; }
        #language { background: none; border: 0; padding: 6px 0 6px 12px; color: #52657b; font-size: 13px; }
        #submit { width: 100%; min-height: 44px; background: #0984e3; color: #fff; border: 0; border-radius: 6px; }
        #submit:hover { background: #0872c3; }
        #submit:disabled { opacity: .6; cursor: wait; }
        #error { margin: 16px 0 0; color: #bc3232; font-size: 14px; overflow-wrap: anywhere; }
        #error:empty { display: none; }
        @media (max-height: 480px) { body { place-items: start center; } }
    </style>
</head>
<body>
    <main>
        <header><h1>iVnc</h1><button id="language" type="button">English</button></header>
        <h2 id="heading">登录远程桌面</h2>
        <p id="login-check" role="status">正在检查登录状态…</p>
        <button id="ip-login" type="button" hidden>免密进入</button>
        <form id="login-form" method="post" hidden>
            <label for="username" id="username-label">用户名</label>
            <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="256">
            <label for="password" id="password-label">密码</label>
            <div class="password-field">
                <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required maxlength="4096">
                <button id="password-toggle" type="button" aria-label="显示密码" title="显示密码" aria-controls="password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="password-eye-slash" d="m3 3 18 18" hidden/></svg>
                </button>
            </div>
            <button id="submit" type="submit">登录</button>
            <p id="error" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script type="module" src="/login.js"></script>
</body>
</html>
