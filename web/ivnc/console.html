<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理控制台</title>
    <link rel="stylesheet" href="./console.css">
</head>
<body>
    <div class="console-shell">
        <aside class="console-sidebar">
            <div class="brand-block">
                <div class="brand-title" id="page-title">管理控制台</div>
                <div class="brand-subtitle" id="console-subtitle">管理应用、运行参数和 Agent</div>
            </div>
            <nav class="nav-list" aria-label="Console sections">
                <button class="nav-item active" data-section="overview" id="nav-overview" type="button">概览</button>
                <button class="nav-item" data-section="apps" id="nav-apps" type="button">应用</button>
                <button class="nav-item" data-section="settings" id="nav-settings" type="button">连接质量</button>
                <button class="nav-item" data-section="agent" id="nav-agent" type="button">MCP / Agent</button>
                <button class="nav-item" data-section="providers" id="nav-providers" type="button">Provider</button>
                <button class="nav-item" data-section="runs" id="nav-runs" type="button">日志 / 轨迹</button>
            </nav>
            <div class="sidebar-footer">
                <button class="lang-toggle" id="lang-toggle" type="button">English</button>
            </div>
        </aside>

        <main class="console-main">
            <div class="page-header">
                <div>
                    <h1 id="section-title">概览</h1>
                    <p class="section-description" id="section-description">当前 iVnc 运行状态和快捷入口。</p>
                </div>
            </div>

            <section class="section active" id="section-overview">
                <div class="summary-grid" id="overview-grid"></div>
                <div class="two-column">
                    <div class="panel">
                        <div class="panel-header">
                            <h2 id="overview-providers-title">Provider 状态</h2>
                        </div>
                        <div class="compact-list" id="overview-providers"></div>
                    </div>
                    <div class="panel">
                        <div class="panel-header">
                            <h2 id="overview-agent-title">Agent 状态</h2>
                            <button class="btn btn-stop btn-sm" id="overview-agent-stop" type="button">停止 Agent</button>
                        </div>
                        <pre class="json-box" id="overview-agent-json">{}</pre>
                    </div>
                </div>
            </section>

            <section class="section" id="section-apps">
                <div class="section-actions">
                    <button class="btn btn-add" id="add-app-btn">+ 添加应用</button>
                </div>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th id="th-name">名称</th>
                                <th id="th-type">类型</th>
                                <th id="th-config">配置</th>
                                <th id="th-status">状态</th>
                                <th id="th-data">数据</th>
                                <th id="th-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody id="app-list">
                            <tr><td colspan="6" class="empty" id="loading-text">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="section" id="section-settings">
                <div class="panel">
                    <div class="panel-header">
                        <h2 id="settings-runtime-title">连接质量</h2>
                        <button class="btn btn-save" id="settings-save" type="button">保存并应用</button>
                    </div>
                    <div class="settings-grid">
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-target-fps">Target FPS</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-target-fps">目标画面帧率，越高越流畅但会增加编码和网络压力。</span>
                                </span>
                            </label>
                            <input id="set-target-fps" type="number" min="1" max="240">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-video-bitrate">Video bitrate (kbps)</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-video-bitrate">视频码率，越高越清晰但占用更多带宽。</span>
                                </span>
                            </label>
                            <input id="set-video-bitrate" type="number" min="1">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-audio-bitrate">Audio bitrate (bps)</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-audio-bitrate">音频编码码率，常用值为 128000。</span>
                                </span>
                            </label>
                            <input id="set-audio-bitrate" type="number" min="1">
                        </div>
                        <div class="form-line param-check">
                            <label class="form-label info-label">
                                <span id="label-binary-clipboard">Binary clipboard</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-binary-clipboard">允许剪贴板同步二进制内容，例如图片或文件片段。</span>
                                </span>
                            </label>
                            <label class="checkbox-row settings-checkbox"><input id="set-binary-clipboard" type="checkbox"><span id="toggle-binary-clipboard">启用</span></label>
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-keyframe">Keyframe</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-keyframe">立即请求下一帧关键帧，画面花屏或恢复连接后可手动触发。</span>
                                </span>
                            </label>
                            <button class="btn btn-clear" id="request-keyframe" type="button">请求关键帧</button>
                        </div>
                    </div>
                    <div class="hint-line" id="settings-hint">这些设置会立即应用并保存为下次启动的控制台默认值。</div>
                </div>
            </section>

            <section class="section" id="section-agent">
                <div class="panel">
                    <div class="panel-header">
                        <h2 id="agent-defaults-title">Agent 默认参数</h2>
                        <button class="btn btn-save" id="agent-save" type="button">保存</button>
                    </div>
                    <div class="settings-grid">
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-agent-provider">Default provider</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-provider">新建 Agent run 默认使用的 VLM Provider。</span>
                                </span>
                            </label>
                            <select id="agent-provider"></select>
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-agent-max-steps">Max steps</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-max-steps">单次任务允许的最大决策步数，达到后自动停止。</span>
                                </span>
                            </label>
                            <input id="agent-max-steps" type="number" min="1">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-agent-max-wall">Max wall seconds</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-max-wall">单次任务的最长运行秒数，超过后自动结束。</span>
                                </span>
                            </label>
                            <input id="agent-max-wall" type="number" min="1">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-agent-screenshot-bytes">Screenshot max bytes</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-screenshot-bytes">发送给模型的单张截图最大字节数，用于控制请求体大小。</span>
                                </span>
                            </label>
                            <input id="agent-screenshot-bytes" type="number" min="10000">
                        </div>
                        <div class="form-line param-check">
                            <label class="form-label info-label">
                                <span id="label-agent-record-trajectory">Record trajectory</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-record-trajectory">保存 Agent 的观察、动作和结果，便于复盘问题。</span>
                                </span>
                            </label>
                            <label class="checkbox-row settings-checkbox"><input id="agent-record-trajectory" type="checkbox"><span id="toggle-agent-record-trajectory">启用</span></label>
                        </div>
                        <div class="form-line param-check">
                            <label class="form-label info-label">
                                <span id="label-agent-dry-run">Dry run</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-agent-dry-run">只生成计划和动作，不真正控制桌面，适合调试 Provider。</span>
                                </span>
                            </label>
                            <label class="checkbox-row settings-checkbox"><input id="agent-dry-run" type="checkbox"><span id="toggle-agent-dry-run">启用</span></label>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section" id="section-providers">
                <div class="provider-layout">
                    <div class="panel">
                        <div class="panel-header"><h2 id="providers-title">Provider</h2></div>
                        <div class="provider-list" id="provider-list"></div>
                    </div>
                    <div class="panel">
                        <div class="panel-header">
                            <h2 id="provider-editor-title">Provider 配置</h2>
                            <button class="btn btn-save" id="provider-save" type="button">保存</button>
                        </div>
                        <input type="hidden" id="provider-name">
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-provider-endpoint">Endpoint</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-provider-endpoint">Provider 的 API 基础地址，留空使用内置默认值。</span>
                                </span>
                            </label>
                            <input id="provider-endpoint" type="text">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-provider-model">Model</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-provider-model">调用的模型名称，需与所选 Provider 支持的模型一致。</span>
                                </span>
                            </label>
                            <input id="provider-model" type="text">
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-provider-api-key">API Key</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-provider-api-key">Provider 凭据。保持为空表示不修改已保存的密钥。</span>
                                </span>
                            </label>
                            <input id="provider-api-key" type="password" placeholder="保持为空表示不修改">
                        </div>
                        <div class="form-line param-check">
                            <label class="form-label info-label">
                                <span id="label-provider-clear-key">Clear API Key</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-provider-clear-key">保存时删除该 Provider 已保存的 API Key。</span>
                                </span>
                            </label>
                            <label class="checkbox-row"><input id="provider-clear-key" type="checkbox"><span id="toggle-provider-clear-key">清除已保存 API Key</span></label>
                        </div>
                        <div class="form-line">
                            <label class="form-label info-label">
                                <span id="label-provider-coord-space">Coordinate space</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="help-provider-coord-space">Provider 返回坐标的空间类型，默认使用该 Provider 的内置约定。</span>
                                </span>
                            </label>
                            <select id="provider-coord-space"><option value="">默认</option><option value="image">image</option><option value="screen">screen</option><option value="normalized">normalized</option></select>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section" id="section-runs">
                <div class="panel">
                    <div class="panel-header">
                        <h2 id="runs-title">Agent runs</h2>
                        <button class="btn btn-clear btn-sm" id="runs-refresh" type="button">刷新</button>
                    </div>
                    <div class="runs-list" id="runs-list"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- 模态框：添加/编辑 -->
    <div class="modal-bg" id="modal">
        <div class="modal app-modal">
            <div class="modal-header">
                <h2 id="modal-title">添加应用</h2>
                <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
            </div>
            <div class="form-line">
                <label class="form-label required-label">
                    <span id="label-name">名称</span>
                    <span class="required-mark">*</span>
                </label>
                <input type="text" id="f-name" placeholder="应用显示名称">
            </div>
            <div class="form-line">
                <label class="form-label required-label">
                    <span id="label-app-type">应用类型</span>
                    <span class="required-mark">*</span>
                </label>
                <select id="f-app-type">
                    <option value="background">后台应用</option>
                    <option value="desktop">桌面应用</option>
                </select>
            </div>

            <div class="checkbox-row" id="autostart-control">
                <input type="checkbox" id="f-autostart">
                <label for="f-autostart" id="label-autostart">开机启动</label>
            </div>
            <div id="general-autostart-slot"></div>
            
            <div id="background-config">
                <div class="form-line command-line">
                    <label class="form-label info-label">
                        <span id="label-launch-command">启动命令</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-launch-command-help">应用启动时要执行的命令</span>
                        </span>
                    </label>
                    <div class="command-control">
                        <div class="command-options">
                        <div id="background-autostart-slot"></div>
                        </div>
                        <input type="text" id="f-launch-command" placeholder="请输入启动命令，例如： python3 app.py --host 0.0.0.0 --port 7860">
                    </div>
                </div>
                <div class="form-line no-label">
                    <div class="split-row">
                        <div class="form-group">
                            <label class="compact-label">
                                <span id="label-launch-cwd">工作目录</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="label-launch-cwd-default">（可选，默认值：当前目录）</span>
                                </span>
                            </label>
                            <input type="text" id="f-launch-cwd" placeholder="请输入工作目录，例如： /workspace/app">
                        </div>
                        <div class="form-group">
                            <label class="compact-label">
                                <span id="label-launch-timeout">等待超时（秒）</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="label-launch-timeout-default">（可选，默认值：30）</span>
                                </span>
                            </label>
                            <input type="number" id="f-launch-timeout" placeholder="请输入超时时间，例如： 30" min="1" max="600">
                        </div>
                    </div>
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-access-url">访问地址</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-access-url-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <input type="text" id="f-url" placeholder="请输入访问地址，例如： http://127.0.0.1:7860">
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-launch-env">环境变量</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-launch-env-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <textarea id="f-launch-env" rows="5" placeholder="请输入环境变量，每行一个，格式：KEY=value&#10;KEY1=value1&#10;KEY2=value2"></textarea>
                </div>
            </div>

            <div id="desktop-config" style="display:none">
                <div class="form-line command-line">
                    <label class="form-label info-label">
                        <span id="label-exec">启动命令</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-exec-help">应用启动时要执行的命令</span>
                        </span>
                    </label>
                    <div class="command-control">
                        <div class="command-options">
                        <div id="desktop-autostart-slot"></div>
                        </div>
                        <input type="text" id="f-exec" placeholder="请输入启动命令，例如： /usr/bin/code --no-sandbox">
                    </div>
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-env">环境变量</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-env-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <textarea id="f-env" rows="5" placeholder="请输入环境变量，每行一个，格式：KEY=value"></textarea>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="modal-cancel">取消</button>
                <button class="btn btn-save" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 模态框：日志 -->
    <div class="modal-bg" id="log-modal">
        <div class="modal log-modal">
            <h2 id="log-title">应用日志</h2>
            <div class="log-content" id="log-content">(加载中...)</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="log-close-btn">关闭</button>
            </div>
        </div>
    </div>

    <script type="module" src="./console.js"></script>
</body>
</html>
