<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理控制台</title>
    <link rel="stylesheet" href="./console.css">
</head>
<body>
    <div class="console-shell">
        <aside class="console-sidebar">
            <div class="brand-block">
                <div class="brand-title" id="page-title">管理控制台</div>
                <div class="brand-subtitle" id="console-subtitle">管理应用与运行参数</div>
            </div>
            <nav class="nav-list" aria-label="Console sections">
                <button class="nav-item active" data-section="overview" id="nav-overview" type="button">概览</button>
                <button class="nav-item" data-section="apps" id="nav-apps" type="button">应用</button>
                <button class="nav-item" data-section="settings" id="nav-settings" type="button">连接质量</button>
            </nav>
            <div class="sidebar-footer">
                <button class="lang-toggle" id="lang-toggle" type="button">English</button>
            </div>
        </aside>

        <main class="console-main">
            <div class="page-header">
                <div>
                    <h1 id="section-title">概览</h1>
                    <p class="section-description" id="section-description">当前 iVnc 运行状态和快捷入口。</p>
                </div>
            </div>

            <section class="section active" id="section-overview">
                <div class="summary-grid" id="overview-grid"></div>
                <div class="overview-meta">
                    <span class="meta-pulse" aria-hidden="true"></span>
                    <span id="overview-meta-text">最后刷新 刚刚</span>
                    <span class="meta-sep">·</span>
                    <span id="overview-meta-auto">自动刷新 5s</span>
                </div>
                <div class="quick-actions" id="overview-quick-actions"></div>
            </section>

            <section class="section" id="section-apps">
                <div class="section-actions">
                    <button class="btn btn-add" id="add-app-btn">+ 添加应用</button>
                </div>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th id="th-name">名称</th>
                                <th id="th-type">类型</th>
                                <th id="th-config">配置</th>
                                <th id="th-status">状态</th>
                                <th id="th-data">数据</th>
                                <th id="th-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody id="app-list">
                            <tr><td colspan="6" class="empty" id="loading-text">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="section" id="section-settings">
                <div class="panel">
                    <div class="panel-section">
                        <div class="panel-section-header">
                            <h3 id="settings-stream-title">串流参数</h3>
                            <span class="dirty-indicator" id="settings-dirty" hidden>● 未保存改动</span>
                        </div>
                        <div class="settings-grid">
                            <div class="form-line">
                                <label class="form-label info-label">
                                    <span id="label-target-fps">Target FPS</span>
                                    <span class="info-tip">
                                        <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                        <span class="default-text" id="help-target-fps">目标画面帧率，越高越流畅但会增加编码和网络压力。</span>
                                    </span>
                                </label>
                                <div class="input-suffix">
                                    <input id="set-target-fps" type="number" min="1" max="240" data-dirty-group="settings">
                                    <span class="suffix" id="suffix-target-fps">fps</span>
                                </div>
                            </div>
                            <div class="form-line">
                                <label class="form-label info-label">
                                    <span id="label-video-bitrate">Video bitrate</span>
                                    <span class="info-tip">
                                        <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                        <span class="default-text" id="help-video-bitrate">视频码率，越高越清晰但占用更多带宽。</span>
                                    </span>
                                </label>
                                <div class="input-suffix">
                                    <input id="set-video-bitrate" type="number" min="1" data-dirty-group="settings">
                                    <span class="suffix" id="suffix-video-bitrate">kbps</span>
                                </div>
                            </div>
                            <div class="form-line">
                                <label class="form-label info-label">
                                    <span id="label-audio-bitrate">Audio bitrate</span>
                                    <span class="info-tip">
                                        <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                        <span class="default-text" id="help-audio-bitrate">音频编码码率，常用值为 128000。</span>
                                    </span>
                                </label>
                                <div class="input-suffix">
                                    <input id="set-audio-bitrate" type="number" min="1" data-dirty-group="settings">
                                    <span class="suffix" id="suffix-audio-bitrate">bps</span>
                                </div>
                            </div>
                            <div class="form-line param-check">
                                <label class="form-label info-label">
                                    <span id="label-binary-clipboard">Binary clipboard</span>
                                    <span class="info-tip">
                                        <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                        <span class="default-text" id="help-binary-clipboard">允许剪贴板同步二进制内容，例如图片或文件片段。</span>
                                    </span>
                                </label>
                                <label class="checkbox-row settings-checkbox"><input id="set-binary-clipboard" type="checkbox" data-dirty-group="settings"><span id="toggle-binary-clipboard">启用</span></label>
                            </div>
                        </div>
                        <div class="panel-section-footer">
                            <span class="muted-hint" id="settings-hint">改动会立即应用并保存为下次启动的默认值。</span>
                            <button class="btn btn-save" id="settings-save" type="button">保存并应用</button>
                        </div>
                    </div>

                    <div class="panel-divider" aria-hidden="true"></div>

                    <div class="panel-section">
                        <div class="panel-section-header">
                            <h3 id="settings-actions-title">即时操作</h3>
                            <span class="muted-hint" id="settings-actions-hint">立即生效，无需保存</span>
                        </div>
                        <div class="action-cards">
                            <div class="action-card">
                                <div class="action-card-body">
                                    <strong id="label-keyframe">Keyframe</strong>
                                    <small id="help-keyframe">立即请求下一帧关键帧，画面花屏或恢复连接后可手动触发。</small>
                                </div>
                                <button class="btn btn-action" id="request-keyframe" type="button">请求关键帧</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>




        </main>
    </div>



    <!-- 模态框：添加/编辑 -->
    <div class="modal-bg" id="modal">
        <div class="modal app-modal">
            <div class="modal-header">
                <h2 id="modal-title">添加应用</h2>
                <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
            </div>
            <div class="form-line">
                <label class="form-label required-label">
                    <span id="label-name">名称</span>
                    <span class="required-mark">*</span>
                </label>
                <input type="text" id="f-name" placeholder="应用显示名称">
            </div>
            <div class="form-line">
                <label class="form-label required-label">
                    <span id="label-app-type">应用类型</span>
                    <span class="required-mark">*</span>
                </label>
                <select id="f-app-type">
                    <option value="background">后台应用</option>
                    <option value="desktop">桌面应用</option>
                    <option value="cli">CLI 应用</option>
                </select>
            </div>

            <div class="checkbox-row" id="autostart-control">
                <input type="checkbox" id="f-autostart">
                <label for="f-autostart" id="label-autostart">开机启动</label>
            </div>
            <div id="general-autostart-slot"></div>

            <div class="form-line">
                <label class="form-label info-label">
                    <span id="label-skill-paths">Skill 路径</span>
                    <span class="info-tip">
                        <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                        <span class="default-text" id="label-skill-paths-default">（可选，每行一个 .md/.txt 文件或包含 SKILL.md 的目录）</span>
                    </span>
                </label>
                <textarea id="f-skill-paths" rows="3" placeholder="/root/.config/ivnc/skills/app/SKILL.md"></textarea>
            </div>
            
            <div id="background-config">
                <div class="form-line command-line">
                    <label class="form-label info-label">
                        <span id="label-launch-command">启动命令</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-launch-command-help">应用启动时要执行的命令</span>
                        </span>
                    </label>
                    <div class="command-control">
                        <div class="command-options">
                        <div id="background-autostart-slot"></div>
                        </div>
                        <input type="text" id="f-launch-command" placeholder="请输入启动命令，例如： python3 app.py --host 0.0.0.0 --port 7860">
                    </div>
                </div>
                <div class="form-line no-label">
                    <div class="split-row">
                        <div class="form-group">
                            <label class="compact-label">
                                <span id="label-launch-cwd">工作目录</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="label-launch-cwd-default">（可选，默认值：当前目录）</span>
                                </span>
                            </label>
                            <input type="text" id="f-launch-cwd" placeholder="请输入工作目录，例如： /workspace/app">
                        </div>
                        <div class="form-group">
                            <label class="compact-label">
                                <span id="label-launch-timeout">等待超时（秒）</span>
                                <span class="info-tip">
                                    <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                                    <span class="default-text" id="label-launch-timeout-default">（可选，默认值：30）</span>
                                </span>
                            </label>
                            <input type="number" id="f-launch-timeout" placeholder="请输入超时时间，例如： 30" min="1" max="600">
                        </div>
                    </div>
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-access-url">访问地址</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-access-url-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <input type="text" id="f-url" placeholder="请输入访问地址，例如： http://127.0.0.1:7860">
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-launch-env">环境变量</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-launch-env-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <textarea id="f-launch-env" rows="5" placeholder="请输入环境变量，每行一个，格式：KEY=value&#10;KEY1=value1&#10;KEY2=value2"></textarea>
                </div>
            </div>

            <div id="desktop-config" style="display:none">
                <div class="form-line command-line">
                    <label class="form-label info-label">
                        <span id="label-exec">启动命令</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-exec-help">应用启动时要执行的命令</span>
                        </span>
                    </label>
                    <div class="command-control">
                        <div class="command-options">
                        <div id="desktop-autostart-slot"></div>
                        </div>
                        <input type="text" id="f-exec" placeholder="请输入启动命令，例如： /usr/bin/code --no-sandbox">
                    </div>
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-env">环境变量</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-env-default">（可选，默认值：无）</span>
                        </span>
                    </label>
                    <textarea id="f-env" rows="5" placeholder="请输入环境变量，每行一个，格式：KEY=value"></textarea>
                </div>
            </div>

            <div id="cli-config" style="display:none">
                <div class="form-line">
                    <label class="form-label required-label">
                        <span id="label-cli-binary">Binary Path</span>
                        <span class="required-mark">*</span>
                    </label>
                    <input type="text" id="f-cli-binary" placeholder="/usr/local/bin/agent-browser">
                </div>
                <div class="form-line">
                    <label class="form-label info-label">
                        <span id="label-cli-env">执行环境变量</span>
                        <span class="info-tip">
                            <span class="info-icon" tabindex="0" role="img" aria-label="说明">?</span>
                            <span class="default-text" id="label-cli-env-default">（可选，调用该 CLI 时附加，每行 KEY=value）</span>
                        </span>
                    </label>
                    <textarea id="f-cli-env" rows="5" placeholder="NO_COLOR=1&#10;AGENT_BROWSER_SESSION=ivnc-default"></textarea>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="modal-cancel">取消</button>
                <button class="btn btn-save" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>


    <!-- 模态框：日志 -->
    <div class="modal-bg" id="log-modal">
        <div class="modal log-modal">
            <h2 id="log-title">应用日志</h2>
            <div class="log-content" id="log-content">(加载中...)</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="log-close-btn">关闭</button>
            </div>
        </div>
    </div>

    <script type="module" src="./console.js"></script>
</body>
</html>
