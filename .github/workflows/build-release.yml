name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            docker_platform: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Docker entrypoint argument forwarding
        run: python3 scripts/docker_entrypoint_test.py -v

      - name: Test build-container DNS selection
        run: python3 scripts/ci_container_dns_test.py -v

      - name: Test Docker APT failure handling
        run: python3 scripts/docker_apt_test.py -v

      - name: Resolve build metadata
        id: build-meta
        run: |
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            git log -1 --pretty=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binary in Docker container
        run: |
          cat > docker-build.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -euo pipefail

          # The runner's Azure mirror is faster and more reliable than archive.ubuntu.com.
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          # Fail on any missing index instead of installing from a partial one.
          apt-get -o Acquire::Retries=5 update --error-on=any
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            ca-certificates \
            cmake \
            gnupg \
            libxcb1-dev \
            libxkbcommon-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpulse-dev \
            libopus-dev \
            libwayland-dev \
            libpixman-1-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends nodejs

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.88.0
          source "$HOME/.cargo/env"

          cd /workspace
          cd web/ivnc
          npm ci
          npm run build
          cd /workspace
          cargo build --release --features tls --bin ivnc
          cp target/release/ivnc /output/ivnc-linux-$ARCH
          BUILDSCRIPT

          chmod +x docker-build.sh
          mkdir -p output

          build_resolv_file="$RUNNER_TEMP/ivnc-build-resolv.conf"
          bash scripts/ci_container_dns.sh ubuntu:22.04 "${{ matrix.docker_platform }}" "$build_resolv_file"

          # Keep the resolver configuration that passed the container probes.
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            --network host \
            --mount "type=bind,src=$build_resolv_file,dst=/etc/resolv.conf,readonly" \
            -v "$(pwd):/workspace" \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/docker-build.sh:/docker-build.sh" \
            -e ARCH=${{ matrix.arch }} \
            -e IVNC_MIAO_URL="${{ vars.IVNC_MIAO_URL }}" \
            -e IVNC_BUILD_GIT_COMMIT="${{ steps.build-meta.outputs.commit }}" \
            -e IVNC_BUILD_GIT_MESSAGE="${{ steps.build-meta.outputs.message }}" \
            ubuntu:22.04 \
            /bin/bash /docker-build.sh

      - name: Verify binary
        run: |
          ls -lh output/
          file output/ivnc-linux-${{ matrix.arch }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivnc-${{ matrix.arch }}
          path: output/ivnc-linux-${{ matrix.arch }}

  docker:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: build-meta
        run: |
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            git log -1 --pretty=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Prepare Docker build DNS
        id: buildkit-dns
        env:
          IVNC_DNS_PROBE_HOSTS: >-
            azure.archive.ubuntu.com security.ubuntu.com deb.debian.org
            registry.npmjs.org index.crates.io static.crates.io github.com
            release-assets.githubusercontent.com dl.google.com
        run: |
          build_resolv_file="$RUNNER_TEMP/ivnc-buildkit-resolv.conf"
          buildkit_config="$RUNNER_TEMP/ivnc-buildkitd.toml"
          bash scripts/ci_container_dns.sh ubuntu:24.04 linux/amd64 "$build_resolv_file"
          python3 - "$build_resolv_file" "$buildkit_config" <<'PY'
          import json
          from pathlib import Path
          import sys

          nameservers = [line.split()[1] for line in Path(sys.argv[1]).read_text().splitlines()
                         if line.startswith("nameserver ")]
          if not nameservers:
              raise SystemExit("No tested DNS resolvers are available for BuildKit")
          Path(sys.argv[2]).write_text(
              "[dns]\nnameservers = " + json.dumps(nameservers)
              + '\noptions = ["timeout:2", "attempts:2"]\n'
          )
          PY
          cat "$buildkit_config"
          echo "config=$buildkit_config" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config: ${{ steps.buildkit-dns.outputs.config }}
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Compute GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.name }}
            docker.io/xiechengqi/ivnc
          tags: |
            type=raw,value=latest
            type=raw,value=noble
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.base.name=ubuntu:24.04

      - name: Build and push Docker image
        id: docker-build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          network: host
          allow: network.host
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=ubuntu:24.04
            EXPECTED_RUNTIME_VERSION=24.04
            IVNC_MIAO_URL=${{ vars.IVNC_MIAO_URL }}
            IVNC_BUILD_GIT_COMMIT=${{ steps.build-meta.outputs.commit }}
            IVNC_BUILD_GIT_MESSAGE=${{ steps.build-meta.outputs.message }}

      - name: Wait before first Docker push retry
        if: steps.docker-build.outcome == 'failure'
        run: sleep 180

      - name: Retry build and push Docker image
        id: docker-build-retry
        if: steps.docker-build.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          network: host
          allow: network.host
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=ubuntu:24.04
            EXPECTED_RUNTIME_VERSION=24.04
            IVNC_MIAO_URL=${{ vars.IVNC_MIAO_URL }}
            IVNC_BUILD_GIT_COMMIT=${{ steps.build-meta.outputs.commit }}
            IVNC_BUILD_GIT_MESSAGE=${{ steps.build-meta.outputs.message }}

      - name: Wait before final Docker push retry
        if: steps.docker-build-retry.outcome == 'failure'
        run: sleep 300

      - name: Final build and push Docker image retry
        id: docker-build-final
        if: steps.docker-build-retry.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          network: host
          allow: network.host
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=ubuntu:24.04
            EXPECTED_RUNTIME_VERSION=24.04
            IVNC_MIAO_URL=${{ vars.IVNC_MIAO_URL }}
            IVNC_BUILD_GIT_COMMIT=${{ steps.build-meta.outputs.commit }}
            IVNC_BUILD_GIT_MESSAGE=${{ steps.build-meta.outputs.message }}

      - name: Verify published Docker images
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          DOCKERHUB_IMAGE: docker.io/xiechengqi/ivnc
          IMAGE_DIGEST: ${{ steps.docker-build-final.outputs.digest || steps.docker-build-retry.outputs.digest || steps.docker-build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"

  release:
    needs:
      - build
      - docker
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ivnc-*
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp artifacts/ivnc-amd64/ivnc-linux-amd64 release-files/ || true
          chmod +x release-files/* || true
          echo "Release files:"
          ls -lh release-files/

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Current version: v${VERSION}"

      - name: Compute GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Delete existing latest release and tag
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (${{ steps.version.outputs.version }})"
          body: |
            ## 最新自动构建版本

            **版本**: ${{ steps.version.outputs.version }}
            **提交**: ${{ github.sha }}
            **分支**: ${{ github.ref_name }}

            ### 下载

            | 架构 | 文件名 |
            |------|--------|
            | AMD64 | `ivnc-linux-amd64` |

            ### Docker 镜像

            GitHub Container Registry:
            ```bash
            docker pull ${{ steps.image.outputs.name }}:latest
            docker pull ${{ steps.image.outputs.name }}:noble
            docker pull ${{ steps.image.outputs.name }}:sha-${{ steps.version.outputs.short_sha }}
            ```

            Docker Hub:
            ```bash
            docker pull docker.io/xiechengqi/ivnc:latest
            ```

            ### 运行时依赖

            Docker 镜像基于 Ubuntu 24.04 LTS，并已包含 iVnc 所需运行时依赖。
          files: release-files/*
          prerelease: false
          draft: false
