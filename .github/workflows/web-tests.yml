name: Web client regression

on:
  push:
    branches: [main]
    paths:
      - 'web/ivnc/**'
      - 'scripts/*_test.mjs'
      - 'scripts/gesture_navigation_smoke.mjs'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'web/ivnc/**'
      - 'scripts/*_test.mjs'
      - 'scripts/gesture_navigation_smoke.mjs'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: web/ivnc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/ivnc/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Test video, viewport and clipboard state
        run: node --test ../../scripts/video_playback_test.mjs ../../scripts/viewport_test.mjs ../../scripts/clipboard_test.mjs
      - name: Test gesture arbitration
        run: node ../../scripts/gesture_navigation_smoke.mjs
      - name: Test native toolbar input in Chromium and WebKit
        run: npm run test:toolbar
      - name: Test independent viewport and pointer mapping in Chromium and WebKit
        run: npm run test:viewport
      - run: npm run build
