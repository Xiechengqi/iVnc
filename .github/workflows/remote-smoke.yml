name: Remote application runtime smoke

# Builds the runtime image and runs the two-instance relay suites inside it.
# Manual: it takes a full image build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t ivnc:remote-review .
      - name: Run remote application suites
        run: IVNC_TEST_IMAGE=ivnc:remote-review bash scripts/remote_app_docker_smoke.sh
